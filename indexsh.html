<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circular Menu Demo by SH</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="content-wrapper">
        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-content">
                <h1>Dorji </br> Shantiniketan</h1>
            </div>
        </section>

        <!-- Circular Menu Section -->
        <div class="circular-menu">
            <div class="ring">
                <!-- Segment 1 -->
                <div class="segment segment-1">
                    <div class="segment-content">
                        <img src="assets/img4.jpeg" alt="Segment 1" class="img img1">
                    </div>
                    <div class="segment-title">Upcycle</div>
                    <div class="segment-description">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Quasi, quo?</div>
                </div>
                
                <!-- Segment 2 -->
                <div class="segment segment-2" data-title="Sustainable" data-description="Maecenas neque urna, ultrices nec malesuada.">
                    <div class="segment-content">
                        <img src="assets/img5.jpeg" alt="Segment 2" class="img img2">
                    </div>
                </div>
                
                <!-- Segment 3 -->
                <div class="segment segment-3" data-title="Eco-Friendly" data-description="Fusce sit amet ligula suscipit, luctus massa vitae.">
                    <div class="segment-content">
                        <img src="assets/img6.jpeg" alt="Segment 3" class="img img3">
                    </div>
                </div>
                
                <!-- Segment 4 -->
                <div class="segment segment-4" data-title="Traditional" data-description="Vestibulum ante ipsum primis in faucibus orci.">
                    <div class="segment-content">
                        <img src="assets/img1.jpeg" alt="Segment 4" class="img img4">
                    </div>
                </div>
                
                <!-- Segment 5 -->
                <div class="segment segment-5" data-title="Artisan" data-description="Praesent euismod, nisi vel consectetur euismod.">
                    <div class="segment-content">
                        <img src="assets/img2.jpeg" alt="Segment 5" class="img img5">
                    </div>
                </div>
                
                <!-- Segment 6 -->
                <div class="segment segment-6" data-title="Handcrafted" data-description="Integer nec odio. Praesent libero.">
                    <div class="segment-content">
                        <img src="assets/img3.jpeg" alt="Segment 6" class="img img6">
                    </div>
                </div>
            </div>
            <div class="center-button">
                <img src="assets/button.png" alt="Center Button">
            </div>
        </div>
        

        <div class="scroll-spacer"></div>
    </div>

    <script>
// Get the circular menu element
const circularMenu = document.querySelector('.circular-menu');

// Listen for scroll events
window.addEventListener('scroll', () => {
    const scrollPosition = window.scrollY;
    const documentHeight = document.documentElement.scrollHeight - window.innerHeight;

    const scrollPercentage = (scrollPosition / documentHeight) * 100;

    // Add 'scrolled' class to circular menu if scrolled past 40%
    if (scrollPercentage > 40) {
        circularMenu.classList.add('scrolled');
    } else {
        circularMenu.classList.remove('scrolled');
    }
});

// Add 'loaded' class to circular menu when page is loaded
window.addEventListener('load', () => {
    circularMenu.classList.add('loaded');
});

// Ensure hover effects are only applied when scrolled
document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.segment').forEach(segment => {
        segment.addEventListener('mouseenter', () => {
            if (circularMenu.classList.contains('scrolled')) {
                // Only apply hover effect when 'scrolled' class is present
                const title = segment.querySelector('.segment-title');
                const description = segment.querySelector('.segment-description');
                const img = segment.querySelector('img'); // Assuming hover effect is on the image

                // Apply the hover effect
                if (img) {
                    img.style.transform = 'scale(1.1)';
                    img.style.zIndex = '1';
                    img.style.border = '3px solid #fff';
                }

                title.style.opacity = '1';
                description.style.opacity = '1';
            }
        });

        segment.addEventListener('mouseleave', () => {
            if (circularMenu.classList.contains('scrolled')) {
                const title = segment.querySelector('.segment-title');
                const description = segment.querySelector('.segment-description');
                const img = segment.querySelector('img');

                // Reset hover effect
                if (img) {
                    img.style.transform = 'scale(1)';
                    img.style.zIndex = '0';
                    img.style.border = 'none';
                }

                title.style.opacity = '0';
                description.style.opacity = '0';
            }
        });
    });
});


    </script>
</body>

</html>
