<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Segment hover handlers
        document.querySelectorAll('.segment').forEach(segment => {
            segment.addEventListener('mouseenter', () => {
                const title = segment.closest('.circular-menu').querySelector('.title');
                const description = segment.closest('.circular-menu').querySelector('.description');
                title.textContent = segment.dataset.title;
                description.textContent = segment.dataset.description;
                title.style.opacity = '1';
                description.style.opacity = '1';
            });

            segment.addEventListener('mouseleave', () => {
                const title = segment.closest('.circular-menu').querySelector('.title');
                const description = segment.closest('.circular-menu').querySelector('.description');
                title.style.opacity = '0';
                description.style.opacity = '0';
            });
        });

        // Scroll handling
        const handleScroll = () => {
            const menu = document.querySelector('.circular-menu');
            if (!menu) return;
            
            const rect = menu.getBoundingClientRect();
            const parentRect = menu.closest('.elementor-widget-html').getBoundingClientRect();
            const scrollPosition = window.scrollY - parentRect.top;
            
            if (scrollPosition > parentRect.height * 0.1) {
                menu.classList.add('scrolled');
            } else {
                menu.classList.remove('scrolled');
            }
        };

        window.addEventListener('scroll', handleScroll);
        handleScroll(); // Initial check
    });
</script>
